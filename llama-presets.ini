; ~/llama-presets.ini
; Use hyphenated keys matching CLI long names (no leading --)
;
; SINGLE local failover for Hermes. "inky" = google gemma-4-E2B (gemma4 arch,
; 131072 trained ctx), served by llama-router.service on :8080, kept warm and
; honest by fallback_guard.sh / fallback_warm.sh.
;
; 2026-09-24: retired the qwen35-* local models entirely (qwen35-fast / tiny-test
; / qwen35-tiny and the standalone llama-qwen35-tiny.service on :45072). The name
; "Inky" now belongs to the E2B model, which is the only local failover.
;
; hf-repo: reproduces the exact launch the router already used for E2B (resolved
;   from the local HF cache; no download while cached). The router names the
;   worker with --alias inky (section name), which fallback_guard.sh keys on.
; ctx-size 131072: the model's full trained context (128K). Cheap here — the model
;   has a single KV head (head_count_kv=1) + 512-token sliding-window attention.
; temp 0.3: ai-gym found gemma fixes the simulated incident 3/3 at 0.3 vs 1/3 at 1.0.
; reasoning off: Hermes sends no thinking toggle, and thinking cost ~50 s per reply.
; load-on-startup: keep inky resident so a failover never pays the ~16 s cold load.
; parallel 1: one slot => every request (probe or warm) shares the same prompt cache;
;   more slots let identical warm-ups land on different slots and redo the ~19k-token
;   prefill each cycle (see llama-presets.ini.pre-parallel-fix.bak, 2026-09-22).
[inky]
hf-repo  = google/gemma-4-E2B-it-qat-q4_0-gguf:IT
ctx-size = 131072
temp = 0.3
reasoning = off
load-on-startup = true
parallel = 1
