; gemma-4-E2B is discovered from the HF cache; this section only overrides
; its defaults. Hermes sends no temperature, so the server default applies —
; ai-gym found gemma fixes the simulated incident 3/3 at 0.3 vs 1/3 at 1.0.
; reasoning off: Hermes sends no thinking toggle, and thinking cost ~50 s per reply.
; load-on-startup: keep gemma resident so a failover never pays the ~16 s cold load
; (fallback_guard.sh also probes it every 5 min and restarts the router if it stops answering).
; parallel = 1 (2026-09-22): was defaulting to 4 slots with no id_slot pinned
; anywhere in fallback_guard.sh/fallback_warm.sh -- identical warm-up requests
; could land on a different slot each cycle, cache never reused, ~19k-token
; prefill redone from scratch every ~20min, ~300% CPU sustained for 3 days.
; One slot removes the ambiguity: every request (probe or warm) shares the
; same cache. Backup: llama-presets.ini.pre-parallel-fix.bak.
[google/gemma-4-E2B-it-qat-q4_0-gguf:IT]
temp = 0.3
reasoning = off
load-on-startup = true
parallel = 1
